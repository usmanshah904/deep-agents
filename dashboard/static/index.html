<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GCP SRE Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M7 21l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css?v=14">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Sections">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><path d="M7 21l6-7 5 4 7-9" class="brand-line"/></svg>
        <div>
          <div class="brand-name">GCP SRE Agent</div>
          <div class="brand-sub">Deep Agents version</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="foot-label">Ask the agent</div>
        <div class="foot-text">Use the <a href="#chat">Chat</a> page. Changes run only after you click Approve.</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Overview</h1>
          <div id="page-sub" class="muted"></div>
        </div>
        <div class="topbar-controls">
          <div id="sources" class="sources"></div>
          <div class="segmented" id="range" role="group" aria-label="Time range for monitoring and logs">
            <button data-hours="1" class="active">1h</button>
            <button data-hours="6">6h</button>
            <button data-hours="24">24h</button>
          </div>
          <button class="icon-btn" id="refresh" title="Refresh data" aria-label="Refresh data">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          </button>
          <button class="icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
            <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
  <script src="/static/charts.js?v=14"></script>
  <script src="/static/app.js?v=14"></script>
</body>
</html>
